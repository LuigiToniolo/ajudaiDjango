<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>{{ tab_title }}</title>
        {% load static %}
        <link rel="stylesheet" type="text/css" href="{% static 'ajudai_django_app/css/database_error.css' %}" />
    </head>
    <body>
        <div id="menu">
            <nav>
              <ul>

        <p>{{ error_message }}</p>
        {{ SUPPORT_EMAIL }}<br><br><br>

</html>
