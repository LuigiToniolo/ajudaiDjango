<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>{{ tab_title }}</title>
        {% load static %}
        <link rel="stylesheet" type="text/css" href="{% static 'ajudai_django_app/css/email_confirmed.css' %}" />
    </head>
    <body>

        <div class="container">
          <div class="card-email">
        
            <img class="lock-icon" src="{% static 'image/verify.svg' %}" alt="Cadeado">
            <p class="message">{{ message }}</p>
            <p>*{{ observation }}</p>

            <div id="menu">
              <nav>
                <ul>
                  {% if user and user.username %}
                    <a class="botao-login" href="{% url 'user_accounts' %}">{{ user.username }} (Minha conta)</a><br>
                  {% else %}
                    <a href="{% url 'login' %}">Log In</a><br>
                  {% endif %}
                </ul>
              </nav>
            </div>

            <meta http-equiv="refresh" content="5;url={% url 'user_accounts' %}" />

          </div>
      </div>

    </body>
</html>
