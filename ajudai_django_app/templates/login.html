{% extends "layout.html" %}
{% block content %}

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ login_form.as_p }}
    <input type="submit" value="{{ submit_login_text }}">
</form>

{% if error_message %}
    <p>{{ error_message }}</p>
{% endif %}
<p><a href="{% url 'password_reset' %}">{{ forgot_password_text }}</a></p>
<a href="{% url 'register' %}">{{ LINK_TO_REGISTER_TEXT }}</a><br><br><br><br>

{% endblock %}
