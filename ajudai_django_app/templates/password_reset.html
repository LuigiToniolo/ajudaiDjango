<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>{{ tab_title }}</title>
        {% load static %}
        <link rel="stylesheet" type="text/css" href="{% static 'ajudai_django_app/css/password_reset.css' %}" />
    </head>
    <body>
      <div class="container">

            <!-- <h3>Redefinir senha</h3>
            <p>Digite seu endereço de e-mail para receber um link para redefinir sua senha.</p>
            <form method="post">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit">Redefinir</button>
            </form> -->

            <div class="card">
              <img class="lock-icon" src="{% static 'image/lock.svg' %}" alt="Cadeado">
              <!-- <h2>Forgot Password?</h2> -->
              <h2>Redefinir senha</h2>
              <!-- <p>You can reset your Password here</p> -->
              <p class="texto-2">Digite seu <strong>e-mail</strong> cadastrado para receber um link para redefinir sua senha.</p>

              <!-- <input type="text" class="passInput" placeholder="Email address"> -->
              <form method="post" class="formulario">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="botoes">
                  <button type="submit">Redefinir</button>
                  <div id="menu">
                    <nav>
                      <ul>
                        {% if user and user.username %}
                        <a href="{% url 'user_accounts' %}">{{ user.username }} (my account)</a><br>
                          {% else %}
                            <a class="botao-login" href="{% url 'login' %}">Log In</a><br>
                            {% endif %}
                          </ul>
                        </nav>
                      </div>
                </div>
              </form>
              <!-- <button>Send My Password</button> -->
          </div>


          </body>
      </div>
</html>
