<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{ tab_title }}</title>
    {% load static %}
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'ajudai_django_app/css/password_reset_confirm.css' %}"
    />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img class="lock-icon" src="{% static 'image/lock.svg' %}" alt="Cadeado">
        <h3>Redefinição de senha</h3>
        <p>Digite uma nova senha para sua conta:</p>
        <form method="post" class="formulario">
          {% csrf_token %} {{ form.as_p }}
          <button class="botao-login" type="submit">Redefinir Senha</button>
        </form>
      </div>
    </div>

                  <a href="{% url 'login' %}">Log In</a><br>
                {% endif %}
              </ul>
            </nav>

  </body>
</html>
