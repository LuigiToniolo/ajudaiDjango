<!DOCTYPE html>
<html lang="en">
  <head>
        {% load static %}
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Pedidos realizados - Ajudai</title>
        <link rel="icon" href="{% static 'image/logo-ajudai-circulo.png' %}">
        <link href="{% static 'css/pedidos-realizados.css' %}" rel="stylesheet" />
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>


    </head>
    <body>
        {% include 'includes/topMenu.html' %}
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">

                {% include 'includes/sidebar.html' %}

            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <div class="kanban">
                            <div class="column-kanban">
                                <div class="title-column">
                                    <p>Pedidos realizados</p>
                                    <i class='fa fa-file' id="icones-kanban"></i>
                                    <span class="card-count">0</span>

                                </div>
                                <ul id="todo" class="dropzone" ondrop="drop(event)" ondragover="allowDrop(event)">
                                  <button onclick="createCard()" class="button-novo">+ Novo pedido</button>
                                </ul>
                            </div>
                            <div class="column-kanban">
                                <div class="title-column">
                                    <p>Pedidos em processo</p>
                                    <i class="fa-solid fa-rotate" id="icones-kanban"></i>
                                    <span class="card-count">0</span>
                                </div>
                              <ul id="inProgress" class="dropzone" ondrop="drop(event)" ondragover="allowDrop(event)">

                              </ul>
                            </div>
                            <div class="column-kanban">
                                <div class="title-column">
                                    <p>Aguardando Entrega</p>
                                    <i class="fa-solid fa-truck" id="icones-kanban"></i>
                                    <span class="card-count">0</span>
                                </div>
                                <ul id="waiting" class="dropzone" ondrop="drop(event)" ondragover="allowDrop(event)">

                                </ul>
                            </div>
                            <div class="column-kanban">
                                <div class="title-column">
                                    <p>Retirado/entregue</p>
                                    <i class="fa-solid fa-circle-check" id="icones-kanban"></i>
                                    <span class="card-count">0</span>
                                </div>
                              <ul id="done" class="dropzone" ondrop="drop(event)" ondragover="allowDrop(event)">

                              </ul>
                            </div>
                          </div>
                          

                    </div>
                </main>
                {% include 'includes/footer.html' %}
            </div>
        </div>
       
        <script>
            function allowDrop(event) {
              event.preventDefault();
            }
        
            function drag(event) {
              event.dataTransfer.setData("text", event.target.id);
            }
        
            function drop(event) {
                event.preventDefault();
                var cardId = event.dataTransfer.getData("text");
                var card = document.getElementById(cardId);
                var dropzone = event.target;

                // Debug log to see if the dropzone is correct
                console.log("Dropzone: ", dropzone);

                // Check if the event.target is a dropzone
                while (dropzone && !dropzone.classList.contains('dropzone')) {
                    dropzone = dropzone.parentNode;
                }

                if (dropzone) {
                    var previousDropzone = card.parentNode;
                    dropzone.appendChild(card);
                    updateCardCount(previousDropzone);
                    updateCardCount(dropzone);

                    // Sending an AJAX request to update the status
                    var newStatus;
                    switch (dropzone.id) {
                        case 'inProgress':
                            newStatus = '{{ STATUS_PEDIDO_EM_PROCESSO }}';
                            break;
                        case 'waiting':
                            newStatus = '{{ STATUS_PEDIDO_PENDENTE_DE_ENTREGA }}';
                            break;
                        case 'done':
                            newStatus = '{{ STATUS_PEDIDO_ENTREGUE }}';
                            break;
                        default:
                            newStatus = '{{ STATUS_PEDIDO_REALIZADO_MANUAL }}';
                            break;
                    }
                    var pedidoId = card.getAttribute('data-id');
                    updateStatusOnServer(pedidoId, newStatus);
                }
            }

            function updateStatusOnServer(pedidoId, newStatus) {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', '{% url "update_pedido_status" %}', true);
                xhr.setRequestHeader('Content-type', 'application/x-www-form-urlencoded');
                xhr.setRequestHeader('X-CSRFToken', '{{ csrf_token }}');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState == 4 && xhr.status == 200) {
                        console.log('Status updated successfully');
                    } else if (xhr.readyState == 4) {
                        console.error('Error updating status:', xhr.statusText);
                    }
                };
                xhr.send('pedido_id=' + pedidoId + '&new_status=' + newStatus);
            }

            function createCard() {
                var cardText = prompt("Digite o texto do novo card:");
                if (cardText) {
                  var card = document.createElement('li');
                  var cardId = 'card-kanban' + new Date().getTime();
                  var cardDateTime = new Date().toLocaleString();
                  var cardDate = cardDateTime.split(',')[0];
                  var cardTime = cardDateTime.split(',')[1].trim();
              
                  card.id = cardId;
                  card.className = 'card-kanban';
                  card.draggable = true;
                  card.addEventListener('dragstart', drag);
                  card.appendChild(document.createTextNode(cardText));
              
                  var datetimeElement = document.createElement('div');
                  datetimeElement.className = 'card-datetime';
              
                  var calendarIcon = document.createElement('i');
                  calendarIcon.className = 'fas fa-calendar';
              
                  var dateElement = document.createElement('span');
                  dateElement.className = 'card-date';
                  dateElement.textContent = cardDate;
              
                  var timeIcon = document.createElement('i');
                  timeIcon.className = 'fas fa-clock';
              
                  var timeElement = document.createElement('span');
                  timeElement.className = 'card-time';
                  timeElement.textContent = cardTime;
              
                  var iconContainer = document.createElement('div');
                  iconContainer.className = 'icon-container';
                  iconContainer.appendChild(calendarIcon);
                  iconContainer.appendChild(dateElement);
              
                  var timeContainer = document.createElement('div');
                  timeContainer.className = 'time-container';
                  timeContainer.appendChild(timeIcon);
                  timeContainer.appendChild(timeElement);
              
                  datetimeElement.appendChild(iconContainer);
                  datetimeElement.appendChild(timeContainer);
              
                  card.appendChild(datetimeElement);
              
                  var select = createSelect();
                  card.appendChild(select);
              
                  document.getElementById('todo').appendChild(card);
                  updateCardCount(document.getElementById('todo'));

                  var xhr = new XMLHttpRequest();
                  xhr.open('POST', '{% url "create_pedido" %}', true);
                  xhr.setRequestHeader('Content-type', 'application/x-www-form-urlencoded');
                  xhr.setRequestHeader('X-CSRFToken', '{{ csrf_token }}');
                  xhr.onreadystatechange = function() {
                      if (xhr.readyState == 4 && xhr.status == 200) {
                          var response = JSON.parse(xhr.responseText);
                          if (response.status === 'success') {
                              // Use response.pedido_id as data-id for the card
                              card.setAttribute('data-id', response.pedido_id);
                          }
                      }
                  };
                  xhr.send('nome_pedido_manual=' + cardText);
                }
            }
              
            function createPedidoCard(pedidoText, status, id, url, date, time) {
                var card = document.createElement('li');
                card.className = 'card-kanban';
                card.draggable = true;
                card.id = 'pedido-card-' + id; // Set a unique ID here
                card.setAttribute('data-id', id); // Set data-id attribute with the id
                
                card.addEventListener('dragstart', drag);
                card.appendChild(document.createTextNode(pedidoText));

                // Date and Time elements
                var datetimeElement = document.createElement('div');
                datetimeElement.className = 'card-datetime';

                var calendarIcon = document.createElement('i');
                calendarIcon.className = 'fas fa-calendar';

                var dateElement = document.createElement('span');
                dateElement.className = 'card-date';
                dateElement.textContent = date;

                var timeIcon = document.createElement('i');
                timeIcon.className = 'fas fa-clock';

                var timeElement = document.createElement('span');
                timeElement.className = 'card-time';
                timeElement.textContent = time;

                var iconContainer = document.createElement('div');
                iconContainer.className = 'icon-container';
                iconContainer.appendChild(calendarIcon);
                iconContainer.appendChild(dateElement);

                var timeContainer = document.createElement('div');
                timeContainer.className = 'time-container';
                timeContainer.appendChild(timeIcon);
                timeContainer.appendChild(timeElement);

                datetimeElement.appendChild(iconContainer);
                datetimeElement.appendChild(timeContainer);

                card.appendChild(datetimeElement);

                // Link
                var link = document.createElement('a');
                link.href = url;
                link.textContent = 'View Details';
                card.appendChild(link);

                var dropzone;
                switch (status) {
                    case '{{ STATUS_PEDIDO_EM_PROCESSO }}': 
                        dropzone = document.getElementById('inProgress');
                        break;
                    case '{{STATUS_PEDIDO_PENDENTE_DE_ENTREGA }}': 
                        dropzone = document.getElementById('waiting');
                        break;
                    case '{{ STATUS_PEDIDO_ENTREGUE }}': 
                        dropzone = document.getElementById('done');
                        break;
                    default:
                        dropzone = document.getElementById('todo');
                        break;
                }

                dropzone.appendChild(card);
                updateCardCount(dropzone);
            }

            function createSelect() {
              var select = document.createElement('select');
              select.addEventListener('change', handleSelectChange);
        
              var options = ['todo', 'inProgress', 'waiting', 'done'];
              options.forEach(function(option) {
                var optionElem = document.createElement('option');
                optionElem.value = option;
                optionElem.text = option.charAt(0).toUpperCase() + option.slice(1);
                select.appendChild(optionElem);
                
              });
        
              return select;
            }
        
            function handleSelectChange(event) {
              var selectedOption = event.target.value;
              var card = event.target.parentNode;
              var dropzone = document.getElementById(selectedOption);
              var previousDropzone = card.parentNode;
              dropzone.appendChild(card);
              updateCardCount(previousDropzone);
              updateCardCount(dropzone);
            }

            function updateCardCount(dropzone) {
                var count = dropzone.querySelectorAll('.card-kanban').length;
                var cardCountElement = dropzone.previousElementSibling.querySelector('.card-count');
                cardCountElement.textContent = count;
            }

            document.addEventListener('DOMContentLoaded', function () {
                {% for pedido in pedidos %}
                    createPedidoCard("{{ pedido }}", "{{ pedido.status_do_pedido }}", {{ pedido.id }}, "{% url 'resumo_pedido' pedido.id %}", "{{ pedido.date }}", "{{ pedido.time }}");
                {% endfor %}
            });

        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <!-- <script src="{% static 'js/scripts.js' %}"></script> -->
    </body>
</html>
