<!DOCTYPE html>
<html lang="en">
    <head>
        {% load static %}
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>{{ tab_title }}</title>
        <link rel="icon" href="{% static 'image/logo-ajudai-circulo.png' %}">
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body>
        {% include 'includes/topMenu.html' %}
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">

                {% include 'includes/sidebar.html' %}

            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <div class="container-welcome">
                            <!-- <h1>Seja bem vindo!</h1> -->
                            <h1>Seja bem vindo {{ user.username }}!</h1>
                            <img class="welcome-img" src="{% static 'image/doodle-welcome.svg' %}" alt="Doodle ajudai welcome">
                            <h4 class="subtitulo-welcome">Assine um de nossos planos e impulsione seu negócio!</h4>
                            <a class="botao-planos" href="{% url 'planos_disponiveis' %}">Ver planos</a>
                        </div>
                    </div>
                </main>
                
                {% include 'includes/footer.html' %}

            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'js/scripts.js' %}"></script>
    </body>
</html>
